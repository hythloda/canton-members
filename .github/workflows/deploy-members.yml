name: Deploy Members

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      MONDAY_API_VERSION: "2026-04"
      MONDAY_BOARD_ID: "18418382784"
      MONDAY_GROUP_ID: group_mm7qj8b3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build-members.mjs
      - name: Commit refreshed Monday data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members.html members-data.js members-assets .env.members.example scripts/build-members.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh members data from Monday"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
